info:
  name: Delete Organisation
  type: http
  seq: 6

http:
  method: DELETE
  url: "{{baseUrl}}/organisations/:id"
  params:
    - name: id
      value: "{{organisationId}}"
      type: path
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "204"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
